<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 30" width="150" height="30">
  <desc>
    Scholar's Hand — top edge tile. Bianchi girari band: white-vine
    spirals carved in negative space against a solid ground band, with
    pinpoint pearl row on inner edge. Edges matched for repeat.
    Informed by: Sanvito's hands for Cardinal Bessarion's library;
    license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <!-- Solid ground band -->
  <rect x="0" y="2" width="150" height="14" fill="#FFFFFF"/>
  <rect x="0" y="0" width="150" height="2" fill="#FFFFFF" opacity="0.55"/>

  <!-- White-vine spirals (negative-space dots within the band) -->
  <g fill="#000000" opacity="0.8">
    <ellipse cx="12" cy="9" rx="3" ry="3"/>
    <ellipse cx="38" cy="9" rx="3" ry="3"/>
    <ellipse cx="64" cy="9" rx="3" ry="3"/>
    <ellipse cx="90" cy="9" rx="3" ry="3"/>
    <ellipse cx="116" cy="9" rx="3" ry="3"/>
    <ellipse cx="142" cy="9" rx="3" ry="3"/>
  </g>

  <!-- Connecting white vines between spirals (S-curve) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5">
    <path d="M 15 9 Q 22 5 26 9 Q 30 13 35 9"/>
    <path d="M 41 9 Q 48 5 52 9 Q 56 13 61 9"/>
    <path d="M 67 9 Q 74 5 78 9 Q 82 13 87 9"/>
    <path d="M 93 9 Q 100 5 104 9 Q 108 13 113 9"/>
    <path d="M 119 9 Q 126 5 130 9 Q 134 13 139 9"/>
  </g>

  <!-- Tendril leaves on the vines (small, restrained) -->
  <g fill="#000000" opacity="0.6">
    <ellipse cx="22" cy="6" rx="1.5" ry="0.8"/>
    <ellipse cx="30" cy="12" rx="1.5" ry="0.8"/>
    <ellipse cx="48" cy="6" rx="1.5" ry="0.8"/>
    <ellipse cx="56" cy="12" rx="1.5" ry="0.8"/>
    <ellipse cx="74" cy="6" rx="1.5" ry="0.8"/>
    <ellipse cx="82" cy="12" rx="1.5" ry="0.8"/>
    <ellipse cx="100" cy="6" rx="1.5" ry="0.8"/>
    <ellipse cx="108" cy="12" rx="1.5" ry="0.8"/>
    <ellipse cx="126" cy="6" rx="1.5" ry="0.8"/>
    <ellipse cx="134" cy="12" rx="1.5" ry="0.8"/>
  </g>

  <!-- Pinpoint pearl row on inner edge -->
  <g fill="#FFFFFF">
    <circle cx="6"  cy="22" r="1.4"/>
    <circle cx="18" cy="22" r="1.4"/>
    <circle cx="30" cy="22" r="1.4"/>
    <circle cx="42" cy="22" r="1.4"/>
    <circle cx="54" cy="22" r="1.4"/>
    <circle cx="66" cy="22" r="1.4"/>
    <circle cx="78" cy="22" r="1.4"/>
    <circle cx="90" cy="22" r="1.4"/>
    <circle cx="102" cy="22" r="1.4"/>
    <circle cx="114" cy="22" r="1.4"/>
    <circle cx="126" cy="22" r="1.4"/>
    <circle cx="138" cy="22" r="1.4"/>
  </g>
</svg>
