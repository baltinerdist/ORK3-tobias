<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <desc>
    Scholar's Hand — NW corner. Renaissance bianchi girari (white-vine
    scrollwork): three triangulated white vine spirals on a dark ground
    band, classical urn at the inner corner, restrained pinpoint pearls.
    Designed for clean 90/180/270 rotation.
    Informed by: Florentine humanist book hands (Bartolomeo Sanvito,
    c. 1470-1490); Vespasiano da Bisticci copies of Cicero; Roman
    Tabula Iliaca-style framing; license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <g fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.55">
    <line x1="150" y1="118" x2="150" y2="150"/>
    <line x1="118" y1="150" x2="150" y2="150"/>
  </g>

  <!-- Right edge: tri-color band (rendered as solid white; family palette
       takes care of the actual color stratification at compositing time) -->
  <g fill="#FFFFFF">
    <rect x="124" y="0" width="14" height="115"/>
  </g>

  <!-- White-vine scrollwork on right band — three open spirals, each
       a triangulated curve that "leaves" a negative-space spiral in the band. -->
  <g fill="#000000" opacity="0.8">
    <path d="M 131 12
             Q 124 16 128 22
             Q 134 22 134 16
             Q 132 12 131 12 Z"/>
    <path d="M 131 42
             Q 124 46 128 52
             Q 134 52 134 46
             Q 132 42 131 42 Z"/>
    <path d="M 131 72
             Q 124 76 128 82
             Q 134 82 134 76
             Q 132 72 131 72 Z"/>
    <path d="M 131 102
             Q 124 106 128 112
             Q 134 112 134 106
             Q 132 102 131 102 Z"/>
  </g>
  <!-- Connecting white-vine ribbons running along the band -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.6">
    <path d="M 131 22 Q 128 30 131 38" />
    <path d="M 131 52 Q 128 60 131 68" />
    <path d="M 131 82 Q 128 90 131 98" />
  </g>

  <!-- Bottom edge: same band -->
  <g fill="#FFFFFF">
    <rect x="0" y="124" width="115" height="14"/>
  </g>
  <g fill="#000000" opacity="0.8">
    <path d="M 12 131 Q 16 138 22 134 Q 22 128 16 128 Q 12 130 12 131 Z"/>
    <path d="M 42 131 Q 46 138 52 134 Q 52 128 46 128 Q 42 130 42 131 Z"/>
    <path d="M 72 131 Q 76 138 82 134 Q 82 128 76 128 Q 72 130 72 131 Z"/>
    <path d="M 102 131 Q 106 138 112 134 Q 112 128 106 128 Q 102 130 102 131 Z"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.6">
    <path d="M 22 131 Q 30 128 38 131" />
    <path d="M 52 131 Q 60 128 68 131" />
    <path d="M 82 131 Q 90 128 98 131" />
  </g>

  <!-- Pinpoint pearl row on inner edges of bands -->
  <g fill="#FFFFFF">
    <circle cx="120" cy="14" r="1.5"/>
    <circle cx="120" cy="44" r="1.5"/>
    <circle cx="120" cy="74" r="1.5"/>
    <circle cx="120" cy="104" r="1.5"/>
    <circle cx="14" cy="120" r="1.5"/>
    <circle cx="44" cy="120" r="1.5"/>
    <circle cx="74" cy="120" r="1.5"/>
    <circle cx="104" cy="120" r="1.5"/>
  </g>

  <!-- Inner-corner: classical urn (Renaissance grotesque stem decoration) -->
  <g transform="translate(122 122)" fill="#FFFFFF">
    <!-- Urn body -->
    <path d="M -12 6 Q -14 -2 -8 -10 Q 8 -10 14 -2 Q 12 6 6 12 L -4 12 Q -10 12 -12 6 Z"/>
    <!-- Urn rim -->
    <ellipse cx="1" cy="-10" rx="11" ry="2.5"/>
    <!-- Urn handles -->
    <path d="M -14 -4 Q -22 -4 -22 4 Q -22 8 -14 8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 16 -4 Q 24 -4 24 4 Q 24 8 16 8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Urn flutes (negative cuts) -->
    <line x1="-6" y1="-6" x2="-4" y2="10" stroke="#000000" stroke-width="0.7" opacity="0.5"/>
    <line x1="0" y1="-7" x2="0" y2="11" stroke="#000000" stroke-width="0.7" opacity="0.5"/>
    <line x1="6" y1="-6" x2="4" y2="10" stroke="#000000" stroke-width="0.7" opacity="0.5"/>
    <!-- Single laurel sprig rising from urn -->
    <g transform="translate(0 -10)">
      <path d="M 0 0 L 0 -16" stroke="#FFFFFF" stroke-width="1.5"/>
      <ellipse cx="-3" cy="-4" rx="2" ry="1" transform="rotate(-30 -3 -4)"/>
      <ellipse cx="3" cy="-7" rx="2" ry="1" transform="rotate(30 3 -7)"/>
      <ellipse cx="-3" cy="-10" rx="2" ry="1" transform="rotate(-30 -3 -10)"/>
      <ellipse cx="3" cy="-13" rx="2" ry="1" transform="rotate(30 3 -13)"/>
    </g>
  </g>
</svg>
