<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <desc>
    Charred Edict — seal stamp. Broken sword crossed over a battered
    shield: the blade snapped at midpoint, jagged break, hilt cross-guard
    intact. The composition reads as defeat-yet-defiance — fitting for
    edicts smuggled out of besieged keeps.
    Informed by: 14th-c. effigy tomb iconography (knight with broken
    sword); the heraldic charge of "sword inverted" symbolizing surrender
    or martyrdom; license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <g transform="translate(120 120)">
    <!-- Outer ring (slightly broken to suggest a damaged seal) -->
    <g fill="none" stroke="#FFFFFF" stroke-width="3">
      <path d="M 0 -110 A 110 110 0 1 1 -2 -110"/>
    </g>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.55"/>

    <!-- Battered shield (heater shield, rough edges) -->
    <g fill="#FFFFFF" opacity="0.85">
      <path d="M -42 -30 L 42 -30 Q 42 30 0 60 Q -42 30 -42 -30 Z"/>
    </g>
    <!-- Shield rim -->
    <g fill="none" stroke="#FFFFFF" stroke-width="2">
      <path d="M -42 -30 L 42 -30 Q 42 30 0 60 Q -42 30 -42 -30 Z"/>
    </g>
    <!-- Battle damage on shield (negative cuts) -->
    <g fill="#000000" opacity="0.5">
      <path d="M -28 -22 L -22 -10 L -32 -16 Z"/>
      <path d="M 18 -8 L 26 -2 L 14 0 Z"/>
      <path d="M -8 28 L 4 32 L -2 38 Z"/>
    </g>

    <!-- Broken sword crossing the shield diagonally (upper-left to lower-right) -->
    <g fill="#FFFFFF">
      <!-- Hilt + pommel -->
      <circle cx="-72" cy="-72" r="9"/>
      <!-- Grip -->
      <rect x="-72" y="-72" width="20" height="6" transform="rotate(45 -72 -72)"/>
      <!-- Cross-guard -->
      <rect x="-66" y="-58" width="28" height="6" transform="rotate(45 -52 -52)"/>
      <!-- Upper blade portion -->
      <polygon points="-50,-50 -42,-58 -8,-24 -16,-16"/>
      <!-- Jagged break -->
      <polygon points="-16,-16 -8,-24 -2,-22 -10,-12 -4,-8 -14,-6"/>
    </g>
    <!-- Lower blade portion (separated, points down-right) -->
    <g fill="#FFFFFF" opacity="0.9">
      <polygon points="6,4 14,-4 50,32 42,40"/>
      <!-- Tip -->
      <polygon points="42,40 50,32 56,38 48,46"/>
    </g>

    <!-- A few embers / ash flecks -->
    <g fill="#FFFFFF" opacity="0.55">
      <circle cx="-68" cy="40" r="2"/>
      <circle cx="-58" cy="50" r="1.5"/>
      <circle cx="62" cy="-40" r="1.8"/>
      <circle cx="72" cy="-30" r="1.2"/>
      <circle cx="0" cy="-78" r="1.5"/>
    </g>
  </g>
</svg>
