<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <desc>
    Charred Edict — NW corner. Minimal scribal frame: single thin
    ink rule, hastily drawn (irregular line weight), with a small
    hand-stamped sigil at the inner corner. The burnt-edge and
    fold-crease filters overlay this at render time, so the corner
    deliberately stays sparse.
    Informed by: 12th-15th c. battlefield dispatches (administrative
    minuscule hands); license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <!-- Single irregular ink rule along inner edge -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5">
    <path d="M 132 0 L 132 116 L 134 120 L 130 124 L 132 128 L 130 132 L 128 134 L 116 134 L 116 132 L 120 132 L 124 130 L 120 132 L 0 132"/>
  </g>

  <!-- Inner corner: hastily-stamped scribal sigil — three concentric arcs -->
  <g transform="translate(120 120)" fill="none" stroke="#FFFFFF" stroke-width="2">
    <path d="M -16 0 Q -16 -16 0 -16" opacity="0.85"/>
    <path d="M -22 4 Q -22 -22 4 -22" opacity="0.6"/>
    <path d="M -10 -2 Q -10 -10 -2 -10" opacity="0.95"/>
  </g>
  <!-- Sigil cross/dot center -->
  <g fill="#FFFFFF">
    <circle cx="120" cy="120" r="2.5"/>
    <line x1="116" y1="120" x2="124" y2="120" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="120" y1="116" x2="120" y2="124" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- A few "ink spatter" dots — irregular -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="100" cy="20" r="1.2"/>
    <circle cx="105" cy="22" r="0.8"/>
    <circle cx="20" cy="100" r="1"/>
    <circle cx="22" cy="105" r="0.6"/>
    <circle cx="60" cy="60" r="0.7"/>
  </g>
</svg>
