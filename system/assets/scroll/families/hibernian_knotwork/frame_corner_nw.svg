<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <desc>
    Hibernian Knotwork — NW corner. Insular triskele with two interlocked
    knot bands radiating along the right and bottom edges to meet the
    frame_edge_top tile at the corner seam. Designed to rotate 90/180/270
    cleanly to produce NE/SE/SW corners.
    Informed by: Book of Kells, Trinity College Dublin MS 58, folio 34r
    (the carpet page); license: PD (manuscript ~AD 800).
    SVG path data: original procedural geometry, CC0.
  </desc>

  <!-- Outer frame ink line (inner edges only, since outer is page edge after compositing) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="150" y1="120" x2="150" y2="150"/>
    <line x1="120" y1="150" x2="150" y2="150"/>
  </g>

  <!-- Knot band running along the inner-right edge (meets the right edge tile when corner is in NE/etc) -->
  <g fill="#FFFFFF">
    <!-- Round knot tile #1 -->
    <circle cx="135" cy="40" r="9" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="135" cy="40" r="3" fill="#FFFFFF"/>
    <!-- Crossing arc into next knot -->
    <path d="M 135 49 Q 135 60 130 65 Q 125 70 130 75 Q 135 80 135 91" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="135" cy="100" r="9" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="135" cy="100" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Knot band running along the inner-bottom edge -->
  <g fill="#FFFFFF">
    <circle cx="40" cy="135" r="9" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="40" cy="135" r="3" fill="#FFFFFF"/>
    <path d="M 49 135 Q 60 135 65 130 Q 70 125 75 130 Q 80 135 91 135" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="100" cy="135" r="9" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="100" cy="135" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Triskele at inner corner (the motif). 3-armed spiral on a disc. -->
  <g transform="translate(115 115)">
    <!-- Outer disc rim -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.55"/>
    <!-- Three spiral arms at 120° offsets -->
    <g fill="#FFFFFF">
      <!-- Arm 1 (top) -->
      <path d="M 0 -16 Q 7 -10 5 -3 Q 3 4 -3 4 Q -7 4 -6 -1" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="-2" cy="0" r="2.5"/>
      <!-- Arm 2 (lower-left, rotate 120) -->
      <g transform="rotate(120)">
        <path d="M 0 -16 Q 7 -10 5 -3 Q 3 4 -3 4 Q -7 4 -6 -1" fill="none" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="-2" cy="0" r="2.5"/>
      </g>
      <!-- Arm 3 (lower-right, rotate 240) -->
      <g transform="rotate(240)">
        <path d="M 0 -16 Q 7 -10 5 -3 Q 3 4 -3 4 Q -7 4 -6 -1" fill="none" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="-2" cy="0" r="2.5"/>
      </g>
      <!-- Center hub -->
      <circle cx="0" cy="0" r="3.5"/>
    </g>
  </g>

  <!-- Connector knots from triskele rim to the two edge bands -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3">
    <path d="M 135 113 Q 130 113 128 116"/>
    <path d="M 113 135 Q 113 130 116 128"/>
  </g>
</svg>
