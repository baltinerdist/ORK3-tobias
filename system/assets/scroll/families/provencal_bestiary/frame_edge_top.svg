    <path d="M 38 19 Q 36 28 44 28 Q 50 27 49 22 Q 46 19 42 19 Z" opacity="0.85"/>
    <path d="M 58 12 Q 52 6 60 4 Q 66 4 66 10 Q 64 13 60 14 Z"/>
    <path d="M 78 19 Q 76 28 84 28 Q 90 27 89 22 Q 86 19 82 19 Z" opacity="0.85"/>
    <path d="M 98 12 Q 92 6 100 4 Q 106 4 106 10 Q 104 13 100 14 Z"/>
    <path d="M 118 19 Q 116 28 124 28 Q 130 27 129 22 Q 126 19 122 19 Z" opacity="0.85"/>
    <path d="M 138 12 Q 132 6 140 4 Q 146 4 146 10 Q 144 13 140 14 Z"/>
  </g>

  <!-- Pomegranate fruit clusters (3 berries) -->
  <g fill="#FFFFFF">
    <circle cx="30" cy="6" r="2"/>
    <circle cx="33" cy="8" r="2"/>
    <circle cx="30" cy="9" r="2"/>
    <circle cx="70" cy="6" r="2"/>
    <circle cx="73" cy="8" r="2"/>
    <circle cx="70" cy="9" r="2"/>
    <circle cx="110" cy="6" r="2"/>
    <circle cx="113" cy="8" r="2"/>
    <circle cx="110" cy="9" r="2"/>
  </g>

  <!-- Curling tendrils -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1">
