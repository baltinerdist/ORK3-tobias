<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 30" width="150" height="30">
  <desc>
    Provençal Bestiary — top edge tile. Whimsical ivy with curling tendrils,
    pomegranate-fruit clusters, asymmetric leaf placement. Edges matched
    for horizontal repeat.
    Informed by: Luttrell Psalter and Romance of Alexander marginalia
    bar borders; license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <line x1="0" y1="29" x2="150" y2="29" stroke="#FFFFFF" stroke-width="1" opacity="0.55"/>

  <!-- Sinuous main vine -->
  <path d="M 0 16 Q 10 8 20 16 Q 30 24 40 16 Q 50 8 60 16 Q 70 24 80 16 Q 90 8 100 16 Q 110 24 120 16 Q 130 8 140 16 Q 145 19 150 16"
        fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

