<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <desc>
    Crimson Decree — seal stamp. Royal crown with three jeweled fleur-de-lis
    apex spikes, ermine band, three jewel cabochons set in the band.
    Encircled by an inscription-style ring with twelve fleurettes.
    Informed by: French royal crown of Charles V (c. 1380); English St
    Edward's crown silhouette; license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <g transform="translate(120 120)">
    <!-- Outer rings -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.55"/>

    <!-- Twelve fleurette dots around the rim -->
    <g fill="#FFFFFF">
      <g transform="translate(0 -100)"><circle cx="0" cy="0" r="3"/><circle cx="0" cy="-4" r="1.5"/></g>
      <g transform="rotate(30)"><g transform="translate(0 -100)"><circle cx="0" cy="0" r="3"/></g></g>
      <g transform="rotate(60)"><g transform="translate(0 -100)"><circle cx="0" cy="0" r="3"/></g></g>
      <g transform="rotate(90)"><g transform="translate(0 -100)"><circle cx="0" cy="0" r="3"/></g></g>
      <g transform="rotate(120)"><g transform="translate(0 -100)"><circle cx="0" cy="0" r="3"/></g></g>
      <g transform="rotate(150)"><g transform="translate(0 -100)"><circle cx="0" cy="0" r="3"/></g></g>
      <g transform="rotate(180)"><g transform="translate(0 -100)"><circle cx="0" cy="0" r="3"/></g></g>
      <g transform="rotate(210)"><g transform="translate(0 -100)"><circle cx="0" cy="0" r="3"/></g></g>
      <g transform="rotate(240)"><g transform="translate(0 -100)"><circle cx="0" cy="0" r="3"/></g></g>
      <g transform="rotate(270)"><g transform="translate(0 -100)"><circle cx="0" cy="0" r="3"/></g></g>
      <g transform="rotate(300)"><g transform="translate(0 -100)"><circle cx="0" cy="0" r="3"/></g></g>
      <g transform="rotate(330)"><g transform="translate(0 -100)"><circle cx="0" cy="0" r="3"/></g></g>
    </g>

    <!-- Inner ring -->
    <circle cx="0" cy="0" r="78" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>

    <!-- Crown -->
    <g fill="#FFFFFF">
      <!-- Base band (ermine-spotted) -->
      <rect x="-48" y="10" width="96" height="22" rx="3"/>
      <!-- Ermine spots (negative dots) -->
      <circle cx="-32" cy="21" r="2" fill="#000000"/>
      <circle cx="-12" cy="21" r="2" fill="#000000"/>
      <circle cx="8" cy="21" r="2" fill="#000000"/>
      <circle cx="28" cy="21" r="2" fill="#000000"/>

      <!-- Three large fleur-de-lis spikes -->
      <!-- Center spike -->
      <g transform="translate(0 8)">
        <path d="M 0 -38 L 6 -10 L -6 -10 Z"/>
        <ellipse cx="0" cy="-10" rx="14" ry="4"/>
        <path d="M -14 -10 Q -22 4 -14 8 Q -6 4 -6 -10 Z"/>
        <path d="M 14 -10 Q 22 4 14 8 Q 6 4 6 -10 Z"/>
        <rect x="-15" y="-4" width="30" height="3"/>
      </g>
      <!-- Left spike -->
      <g transform="translate(-32 12)">
        <path d="M 0 -28 L 4 -8 L -4 -8 Z"/>
        <ellipse cx="0" cy="-8" rx="9" ry="3"/>
        <path d="M -9 -8 Q -14 2 -9 4 Q -3 2 -3 -8 Z"/>
        <path d="M 9 -8 Q 14 2 9 4 Q 3 2 3 -8 Z"/>
      </g>
      <!-- Right spike -->
      <g transform="translate(32 12)">
        <path d="M 0 -28 L 4 -8 L -4 -8 Z"/>
        <ellipse cx="0" cy="-8" rx="9" ry="3"/>
        <path d="M -9 -8 Q -14 2 -9 4 Q -3 2 -3 -8 Z"/>
        <path d="M 9 -8 Q 14 2 9 4 Q 3 2 3 -8 Z"/>
      </g>

      <!-- Three jewel cabochons in the band -->
      <circle cx="-28" cy="21" r="4.5"/>
      <circle cx="0" cy="21" r="6"/>
      <circle cx="28" cy="21" r="4.5"/>
    </g>

    <!-- Jewel sparkle highlights (negative cuts on cabochons) -->
    <g fill="#000000">
      <circle cx="-30" cy="19" r="1.2"/>
      <circle cx="-2" cy="19" r="1.5"/>
      <circle cx="26" cy="19" r="1.2"/>
    </g>
  </g>
</svg>
