<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 30" width="150" height="30">
  <desc>
    Northern Gothic — top edge tile. Continuous ivy bar with five trefoil
    leaves, gilded besants between, sinuous central trunk. Edges matched
    for horizontal repeat.
    Informed by: Luttrell Psalter bar borders; license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <!-- Inner ink rule -->
  <line x1="0" y1="29" x2="150" y2="29" stroke="#FFFFFF" stroke-width="1" opacity="0.55"/>

  <!-- Sinuous ivy trunk (continuous across tile boundaries) -->
  <path d="M 0 18 Q 7.5 12 15 18 Q 22.5 24 30 18 Q 37.5 12 45 18 Q 52.5 24 60 18 Q 67.5 12 75 18 Q 82.5 24 90 18 Q 97.5 12 105 18 Q 112.5 24 120 18 Q 127.5 12 135 18 Q 142.5 24 150 18"
        fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Trefoil leaves on alternating sides -->
  <g fill="#FFFFFF">
    <path d="M 15 14 Q 12 6 18 4 Q 24 2 24 8 Q 22 13 18 14 Z"/>
    <path d="M 45 14 Q 42 6 48 4 Q 54 2 54 8 Q 52 13 48 14 Z"/>
    <path d="M 75 14 Q 72 6 78 4 Q 84 2 84 8 Q 82 13 78 14 Z"/>
    <path d="M 105 14 Q 102 6 108 4 Q 114 2 114 8 Q 112 13 108 14 Z"/>
    <path d="M 135 14 Q 132 6 138 4 Q 144 2 144 8 Q 142 13 138 14 Z"/>
    <!-- lower-side leaves -->
    <path d="M 30 22 Q 27 30 33 30 Q 39 29 38 24 Q 35 21 30 22 Z" opacity="0.8"/>
    <path d="M 60 22 Q 57 30 63 30 Q 69 29 68 24 Q 65 21 60 22 Z" opacity="0.8"/>
    <path d="M 90 22 Q 87 30 93 30 Q 99 29 98 24 Q 95 21 90 22 Z" opacity="0.8"/>
    <path d="M 120 22 Q 117 30 123 30 Q 129 29 128 24 Q 125 21 120 22 Z" opacity="0.8"/>
  </g>

  <!-- Gilded besants between leaves -->
  <g fill="#FFFFFF">
    <circle cx="30" cy="11" r="2.5"/>
    <circle cx="60" cy="11" r="2.5"/>
    <circle cx="90" cy="11" r="2.5"/>
    <circle cx="120" cy="11" r="2.5"/>
  </g>
</svg>
