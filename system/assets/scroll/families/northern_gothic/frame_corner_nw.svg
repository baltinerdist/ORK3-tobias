<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <desc>
    Northern Gothic — NW corner. Naturalistic ivy bar with three-lobed
    leaves, acanthus curl at the inner corner, gilded besant boss.
    Designed for clean 90/180/270 rotation.
    Informed by: Luttrell Psalter (BL Add MS 42130, c. 1325-1340) bar
    border conventions; license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <!-- Inner ink rule -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.55">
    <line x1="150" y1="118" x2="150" y2="150"/>
    <line x1="118" y1="150" x2="150" y2="150"/>
  </g>

  <!-- Vertical ivy bar along right edge -->
  <g fill="#FFFFFF">
    <!-- Bar trunk (sinuous) -->
    <path d="M 130 0 Q 135 15 130 30 Q 125 45 130 60 Q 135 75 130 90 Q 127 100 130 110" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Trefoil ivy leaves alternating sides -->
    <g>
      <path d="M 130 12 Q 142 9 144 16 Q 146 22 138 24 Q 132 23 130 18 Z"/>
      <path d="M 128 30 Q 116 28 116 36 Q 117 41 124 41 Q 130 40 130 35 Z"/>
      <path d="M 130 50 Q 142 48 144 56 Q 144 62 136 62 Q 130 60 130 55 Z"/>
      <path d="M 128 70 Q 116 68 116 76 Q 117 81 124 81 Q 130 80 130 75 Z"/>
      <path d="M 130 90 Q 142 88 144 96 Q 144 102 136 102 Q 130 100 130 95 Z"/>
    </g>
    <!-- Tendrils -->
    <g fill="none" stroke="#FFFFFF" stroke-width="1.2">
      <path d="M 144 16 Q 148 18 146 26"/>
      <path d="M 116 36 Q 112 38 114 46"/>
      <path d="M 144 56 Q 148 58 146 66"/>
    </g>
  </g>

  <!-- Horizontal ivy bar along bottom edge -->
  <g fill="#FFFFFF">
    <path d="M 0 130 Q 15 135 30 130 Q 45 125 60 130 Q 75 135 90 130 Q 100 127 110 130" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <g>
      <path d="M 12 130 Q 9 142 16 144 Q 22 146 24 138 Q 23 132 18 130 Z"/>
      <path d="M 30 128 Q 28 116 36 116 Q 41 117 41 124 Q 40 130 35 130 Z"/>
      <path d="M 50 130 Q 48 142 56 144 Q 62 144 62 136 Q 60 130 55 130 Z"/>
      <path d="M 70 128 Q 68 116 76 116 Q 81 117 81 124 Q 80 130 75 130 Z"/>
      <path d="M 90 130 Q 88 142 96 144 Q 102 144 102 136 Q 100 130 95 130 Z"/>
    </g>
  </g>

  <!-- Inner corner: gilded besant + acanthus curl rosette -->
  <g transform="translate(125 125)">
    <!-- Besant -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="11" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
    <circle cx="-3" cy="-3" r="5" fill="#FFFFFF" opacity="0.7"/>
    <!-- Acanthus curls (4 quadrants) -->
    <g fill="#FFFFFF">
      <path d="M -14 0 Q -22 -2 -22 -10 Q -22 -16 -16 -16 Q -12 -14 -12 -10" opacity="0.85"/>
      <path d="M 0 -14 Q 2 -22 10 -22 Q 16 -22 16 -16 Q 14 -12 10 -12" opacity="0.85"/>
      <path d="M 14 0 Q 22 2 22 10 Q 22 16 16 16 Q 12 14 12 10" opacity="0.85"/>
      <path d="M 0 14 Q -2 22 -10 22 Q -16 22 -16 16 Q -14 12 -10 12" opacity="0.85"/>
    </g>
  </g>
</svg>
