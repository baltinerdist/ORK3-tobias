<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <desc>
    Imperial Edict — NW corner. Byzantine jeweled cabochon border:
    alternating round + lozenge cabochons set in gold cloisonné cells,
    pearl-row inner edge, axial-symmetric corner medallion with cross.
    Designed for clean 90/180/270 rotation.
    Informed by: cloisonné enamel of the Pala d'Oro (St Mark's Venice,
    c. 11th-14th c.); Byzantine Lectionary BNF Coislin 18 borders;
    license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <g fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.55">
    <line x1="150" y1="118" x2="150" y2="150"/>
    <line x1="118" y1="150" x2="150" y2="150"/>
  </g>

  <!-- Solid jeweled border band along right edge -->
  <g fill="#FFFFFF">
    <rect x="124" y="0" width="14" height="115"/>
  </g>
  <!-- Cloisonné cell divisions (negative lines) -->
  <g stroke="#000000" stroke-width="0.7" opacity="0.4">
    <line x1="124" y1="14" x2="138" y2="14"/>
    <line x1="124" y1="28" x2="138" y2="28"/>
    <line x1="124" y1="42" x2="138" y2="42"/>
    <line x1="124" y1="56" x2="138" y2="56"/>
    <line x1="124" y1="70" x2="138" y2="70"/>
    <line x1="124" y1="84" x2="138" y2="84"/>
    <line x1="124" y1="98" x2="138" y2="98"/>
    <line x1="124" y1="112" x2="138" y2="112"/>
  </g>

  <!-- Round + lozenge cabochons alternating in cells -->
  <g fill="#FFFFFF">
    <!-- Round -->
    <circle cx="131" cy="7" r="4"/>
    <circle cx="131" cy="35" r="4"/>
    <circle cx="131" cy="63" r="4"/>
    <circle cx="131" cy="91" r="4"/>
    <!-- Lozenge -->
    <polygon points="131,17 135,21 131,25 127,21"/>
    <polygon points="131,45 135,49 131,53 127,49"/>
    <polygon points="131,73 135,77 131,81 127,77"/>
    <polygon points="131,101 135,105 131,109 127,105"/>
  </g>
  <!-- Cabochon highlight pinpricks (negative dots inside white) -->
  <g fill="#000000" opacity="0.5">
    <circle cx="129" cy="5" r="1"/>
    <circle cx="129" cy="33" r="1"/>
    <circle cx="129" cy="61" r="1"/>
    <circle cx="129" cy="89" r="1"/>
  </g>

  <!-- Pearl row on inner edge of right band -->
  <g fill="#FFFFFF">
    <circle cx="120" cy="6" r="1.8"/>
    <circle cx="120" cy="14" r="1.8"/>
    <circle cx="120" cy="22" r="1.8"/>
    <circle cx="120" cy="30" r="1.8"/>
    <circle cx="120" cy="38" r="1.8"/>
    <circle cx="120" cy="46" r="1.8"/>
    <circle cx="120" cy="54" r="1.8"/>
    <circle cx="120" cy="62" r="1.8"/>
    <circle cx="120" cy="70" r="1.8"/>
    <circle cx="120" cy="78" r="1.8"/>
    <circle cx="120" cy="86" r="1.8"/>
    <circle cx="120" cy="94" r="1.8"/>
    <circle cx="120" cy="102" r="1.8"/>
    <circle cx="120" cy="110" r="1.8"/>
  </g>

  <!-- Solid jeweled border band along bottom edge (mirror of right) -->
  <g fill="#FFFFFF">
    <rect x="0" y="124" width="115" height="14"/>
  </g>
  <g stroke="#000000" stroke-width="0.7" opacity="0.4">
    <line x1="14" y1="124" x2="14" y2="138"/>
    <line x1="28" y1="124" x2="28" y2="138"/>
    <line x1="42" y1="124" x2="42" y2="138"/>
    <line x1="56" y1="124" x2="56" y2="138"/>
    <line x1="70" y1="124" x2="70" y2="138"/>
    <line x1="84" y1="124" x2="84" y2="138"/>
    <line x1="98" y1="124" x2="98" y2="138"/>
    <line x1="112" y1="124" x2="112" y2="138"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="7" cy="131" r="4"/>
    <circle cx="35" cy="131" r="4"/>
    <circle cx="63" cy="131" r="4"/>
    <circle cx="91" cy="131" r="4"/>
    <polygon points="17,131 21,135 25,131 21,127"/>
    <polygon points="45,131 49,135 53,131 49,127"/>
    <polygon points="73,131 77,135 81,131 77,127"/>
    <polygon points="101,131 105,135 109,131 105,127"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="6" cy="120" r="1.8"/>
    <circle cx="14" cy="120" r="1.8"/>
    <circle cx="22" cy="120" r="1.8"/>
    <circle cx="30" cy="120" r="1.8"/>
    <circle cx="38" cy="120" r="1.8"/>
    <circle cx="46" cy="120" r="1.8"/>
    <circle cx="54" cy="120" r="1.8"/>
    <circle cx="62" cy="120" r="1.8"/>
    <circle cx="70" cy="120" r="1.8"/>
    <circle cx="78" cy="120" r="1.8"/>
    <circle cx="86" cy="120" r="1.8"/>
    <circle cx="94" cy="120" r="1.8"/>
    <circle cx="102" cy="120" r="1.8"/>
    <circle cx="110" cy="120" r="1.8"/>
  </g>

  <!-- Inner-corner medallion: cross-pattée in gold disc -->
  <g transform="translate(122 122)">
    <!-- Outer disc -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#000000" stroke-width="0.6" opacity="0.45"/>
    <!-- Cross-pattée (Byzantine variant) -->
    <g fill="#000000" opacity="0.55">
      <path d="M -2 -10 Q -6 -10 -8 -7 L -2 -2 Z"/>
      <path d="M 2 -10 Q 6 -10 8 -7 L 2 -2 Z"/>
      <path d="M -2 10 Q -6 10 -8 7 L -2 2 Z"/>
      <path d="M 2 10 Q 6 10 8 7 L 2 2 Z"/>
      <path d="M -10 -2 Q -10 -6 -7 -8 L -2 -2 Z"/>
      <path d="M -10 2 Q -10 6 -7 8 L -2 2 Z"/>
      <path d="M 10 -2 Q 10 -6 7 -8 L 2 -2 Z"/>
      <path d="M 10 2 Q 10 6 7 8 L 2 2 Z"/>
      <rect x="-2" y="-2" width="4" height="4"/>
    </g>
  </g>
</svg>
