<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 30" width="150" height="30">
  <desc>
    Imperial Edict — top edge tile. Byzantine cloisonné jeweled band:
    alternating round + lozenge cabochons in gold cells, pearl row on
    inner edge, axial-symmetric repeat.
    Informed by: Pala d'Oro cell-and-jewel decoration; Constantinopolitan
    enamel ateliers; license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <!-- Solid jeweled band -->
  <rect x="0" y="2" width="150" height="14" fill="#FFFFFF"/>
  <rect x="0" y="0" width="150" height="2" fill="#FFFFFF" opacity="0.55"/>
  <rect x="0" y="16" width="150" height="1" fill="#FFFFFF" opacity="0.4"/>

  <!-- Cell divisions -->
  <g stroke="#000000" stroke-width="0.6" opacity="0.4">
    <line x1="15" y1="2" x2="15" y2="16"/>
    <line x1="30" y1="2" x2="30" y2="16"/>
    <line x1="45" y1="2" x2="45" y2="16"/>
    <line x1="60" y1="2" x2="60" y2="16"/>
    <line x1="75" y1="2" x2="75" y2="16"/>
    <line x1="90" y1="2" x2="90" y2="16"/>
    <line x1="105" y1="2" x2="105" y2="16"/>
    <line x1="120" y1="2" x2="120" y2="16"/>
    <line x1="135" y1="2" x2="135" y2="16"/>
  </g>

  <!-- Round + lozenge cabochons -->
  <g fill="#FFFFFF">
    <circle cx="7.5" cy="9" r="3.5"/>
    <polygon points="22.5,9 26,12 22.5,15 19,12 22.5,9 22.5,5 26,8 22.5,9 19,8"/>
    <circle cx="37.5" cy="9" r="3.5"/>
    <polygon points="52.5,9 56,12 52.5,15 49,12 52.5,9 52.5,5 56,8 52.5,9 49,8"/>
    <circle cx="67.5" cy="9" r="3.5"/>
    <polygon points="82.5,9 86,12 82.5,15 79,12 82.5,9 82.5,5 86,8 82.5,9 79,8"/>
    <circle cx="97.5" cy="9" r="3.5"/>
    <polygon points="112.5,9 116,12 112.5,15 109,12 112.5,9 112.5,5 116,8 112.5,9 109,8"/>
    <circle cx="127.5" cy="9" r="3.5"/>
    <polygon points="142.5,9 146,12 142.5,15 139,12 142.5,9 142.5,5 146,8 142.5,9 139,8"/>
  </g>
  <!-- Cabochon highlight pinpricks -->
  <g fill="#000000" opacity="0.5">
    <circle cx="6" cy="7.5" r="0.9"/>
    <circle cx="36" cy="7.5" r="0.9"/>
    <circle cx="66" cy="7.5" r="0.9"/>
    <circle cx="96" cy="7.5" r="0.9"/>
    <circle cx="126" cy="7.5" r="0.9"/>
  </g>

  <!-- Pearl row on inner edge -->
  <g fill="#FFFFFF">
    <circle cx="6"  cy="22" r="1.6"/>
    <circle cx="14" cy="22" r="1.6"/>
    <circle cx="22" cy="22" r="1.6"/>
    <circle cx="30" cy="22" r="1.6"/>
    <circle cx="38" cy="22" r="1.6"/>
    <circle cx="46" cy="22" r="1.6"/>
    <circle cx="54" cy="22" r="1.6"/>
    <circle cx="62" cy="22" r="1.6"/>
    <circle cx="70" cy="22" r="1.6"/>
    <circle cx="78" cy="22" r="1.6"/>
    <circle cx="86" cy="22" r="1.6"/>
    <circle cx="94" cy="22" r="1.6"/>
    <circle cx="102" cy="22" r="1.6"/>
    <circle cx="110" cy="22" r="1.6"/>
    <circle cx="118" cy="22" r="1.6"/>
    <circle cx="126" cy="22" r="1.6"/>
    <circle cx="134" cy="22" r="1.6"/>
