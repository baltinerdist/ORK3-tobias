<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <desc>
    Imperial Edict — seal stamp. Byzantine double-headed eagle (the
    Palaiologan dynastic emblem): two heads turned outward, wings
    outspread, tail fanned, holding orb and scepter. Encircled by
    pearl ring + cross-pattée at the four cardinal points.
    Informed by: Palaiologan imperial seal of Andronikos II
    (c. 1295); Byzantine catepan double-eagle on the manuscript of the
    Treaty of Devol (1108); license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <g transform="translate(120 120)">
    <!-- Outer rings -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.55"/>

    <!-- Pearl ring -->
    <g fill="#FFFFFF">
      <g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g>
      <g transform="rotate(15)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(30)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(45)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(60)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(75)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(105)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(120)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(135)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(150)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(165)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(195)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(210)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(225)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(240)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(255)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(285)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(300)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(315)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(330)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
      <g transform="rotate(345)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2.5"/></g></g>
    </g>

    <!-- Cross-pattée at four cardinal points (replaces pearls there) -->
    <g fill="#FFFFFF">
      <g transform="translate(0 -94)">
        <path d="M -2 -7 L 2 -7 L 2 -2 L 7 -2 L 7 2 L 2 2 L 2 7 L -2 7 L -2 2 L -7 2 L -7 -2 L -2 -2 Z"/>
      </g>
      <g transform="rotate(90)"><g transform="translate(0 -94)">
        <path d="M -2 -7 L 2 -7 L 2 -2 L 7 -2 L 7 2 L 2 2 L 2 7 L -2 7 L -2 2 L -7 2 L -7 -2 L -2 -2 Z"/>
      </g></g>
      <g transform="rotate(180)"><g transform="translate(0 -94)">
        <path d="M -2 -7 L 2 -7 L 2 -2 L 7 -2 L 7 2 L 2 2 L 2 7 L -2 7 L -2 2 L -7 2 L -7 -2 L -2 -2 Z"/>
      </g></g>
      <g transform="rotate(270)"><g transform="translate(0 -94)">
        <path d="M -2 -7 L 2 -7 L 2 -2 L 7 -2 L 7 2 L 2 2 L 2 7 L -2 7 L -2 2 L -7 2 L -7 -2 L -2 -2 Z"/>
      </g></g>
    </g>

    <!-- Inner ring -->
    <circle cx="0" cy="0" r="74" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>

    <!-- Double-headed eagle: body silhouette + outspread wings -->
    <g fill="#FFFFFF">
      <!-- Central body torso -->
      <ellipse cx="0" cy="0" rx="14" ry="32"/>
      <!-- Left head + neck -->
      <path d="M -8 -22 Q -16 -32 -22 -42 Q -22 -50 -14 -52 Q -8 -50 -8 -38 Z"/>
      <!-- Left head detail (beak protrusion) -->
      <path d="M -22 -50 L -28 -52 L -22 -46 Z"/>
      <!-- Right head + neck -->
      <path d="M 8 -22 Q 16 -32 22 -42 Q 22 -50 14 -52 Q 8 -50 8 -38 Z"/>
      <path d="M 22 -50 L 28 -52 L 22 -46 Z"/>
      <!-- Crowns above heads -->
      <rect x="-22" y="-58" width="14" height="3"/>
      <polygon points="-22,-58 -18,-64 -14,-58"/>
      <polygon points="-18,-64 -14,-66 -12,-58"/>
      <rect x="8" y="-58" width="14" height="3"/>
      <polygon points="8,-58 12,-64 16,-58"/>
      <polygon points="12,-64 16,-66 18,-58"/>
      <!-- Heads' eyes (negative) -->
      <circle cx="-18" cy="-46" r="1.5" fill="#000000"/>
      <circle cx="18" cy="-46" r="1.5" fill="#000000"/>

      <!-- Left wing outspread -->
      <path d="M -14 -10 Q -42 -14 -56 4 Q -52 14 -42 16 Q -28 12 -16 4 Z"/>
      <!-- Wing feathers (chevrons) -->
      <g fill="none" stroke="#000000" stroke-width="1" opacity="0.45">
        <path d="M -42 -8 Q -38 0 -34 -2"/>
        <path d="M -48 -2 Q -42 6 -38 4"/>
        <path d="M -50 6 Q -44 10 -40 8"/>
      </g>
      <!-- Right wing outspread -->
      <path d="M 14 -10 Q 42 -14 56 4 Q 52 14 42 16 Q 28 12 16 4 Z"/>
      <g fill="none" stroke="#000000" stroke-width="1" opacity="0.45">
        <path d="M 42 -8 Q 38 0 34 -2"/>
        <path d="M 48 -2 Q 42 6 38 4"/>
        <path d="M 50 6 Q 44 10 40 8"/>
      </g>

      <!-- Tail fanned -->
      <path d="M -10 28 Q -16 50 -8 56 L 0 36 L 8 56 Q 16 50 10 28 Z"/>
      <g fill="none" stroke="#000000" stroke-width="1" opacity="0.45">
        <line x1="-6" y1="34" x2="-6" y2="50"/>
        <line x1="6" y1="34" x2="6" y2="50"/>
        <line x1="0" y1="34" x2="0" y2="52"/>
      </g>

      <!-- Left talon holds orb (globus cruciger) -->
      <g transform="translate(-30 28)">
        <circle cx="0" cy="0" r="6"/>
        <line x1="0" y1="-8" x2="0" y2="-2" stroke="#FFFFFF" stroke-width="2"/>
        <line x1="-2" y1="-6" x2="2" y2="-6" stroke="#FFFFFF" stroke-width="2"/>
      </g>
      <!-- Right talon holds scepter -->
      <g transform="translate(30 28)">
        <line x1="0" y1="-12" x2="0" y2="6" stroke="#FFFFFF" stroke-width="2.5"/>
        <circle cx="0" cy="-12" r="3"/>
      </g>
    </g>
  </g>
</svg>
