<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <desc>
    Crusader's Charter — NW corner. Romanesque round-arch architectural
    frame: half-column with stylized capital springing into a rounded
    arch shoulder, chevron moulding on the inner edge, jeweled cross
    boss at the corner. Designed for clean 90/180/270 rotation.
    Informed by: Romanesque tympana of Vézelay (c. 1130) and Saint-
    Trophime in Arles; Westminster Psalter (BL Royal MS 2.A.XXII)
    initial pages; license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <g fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.55">
    <line x1="150" y1="118" x2="150" y2="150"/>
    <line x1="118" y1="150" x2="150" y2="150"/>
  </g>

  <!-- Half-column shaft along right edge -->
  <g fill="#FFFFFF">
    <rect x="124" y="20" width="14" height="98"/>
    <!-- Column flutes (4 vertical) -->
    <line x1="127" y1="22" x2="127" y2="116" stroke="#000000" stroke-width="0.6" opacity="0.4"/>
    <line x1="131" y1="22" x2="131" y2="116" stroke="#000000" stroke-width="0.6" opacity="0.4"/>
    <line x1="135" y1="22" x2="135" y2="116" stroke="#000000" stroke-width="0.6" opacity="0.4"/>
    <!-- Capital -->
    <rect x="120" y="14" width="22" height="6"/>
    <!-- Capital astragal molding -->
    <ellipse cx="131" cy="14" rx="11" ry="2"/>
    <!-- Base -->
    <rect x="120" y="118" width="22" height="6"/>
  </g>

  <!-- Half-arch shoulder above the capital (round arch springing inward) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.5">
    <path d="M 131 14 Q 131 0 117 0"/>
  </g>
  <!-- Inner gilded line of arch -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7">
    <path d="M 127 14 Q 127 4 117 4"/>
  </g>

  <!-- Bottom edge: half-column + base -->
  <g fill="#FFFFFF">
    <rect x="20" y="124" width="98" height="14"/>
    <line x1="22" y1="127" x2="116" y2="127" stroke="#000000" stroke-width="0.6" opacity="0.4"/>
    <line x1="22" y1="131" x2="116" y2="131" stroke="#000000" stroke-width="0.6" opacity="0.4"/>
    <line x1="22" y1="135" x2="116" y2="135" stroke="#000000" stroke-width="0.6" opacity="0.4"/>
    <rect x="14" y="120" width="6" height="22"/>
    <ellipse cx="14" cy="131" rx="2" ry="11"/>
    <rect x="118" y="120" width="6" height="22"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="3.5">
    <path d="M 14 131 Q 0 131 0 117"/>
  </g>

  <!-- Chevron moulding on inner edge of right shaft -->
  <g fill="#FFFFFF">
    <polygon points="120,30 116,34 120,38"/>
    <polygon points="120,46 116,50 120,54"/>
    <polygon points="120,62 116,66 120,70"/>
    <polygon points="120,78 116,82 120,86"/>
    <polygon points="120,94 116,98 120,102"/>
  </g>
  <g fill="#FFFFFF">
    <polygon points="30,120 34,116 38,120"/>
    <polygon points="46,120 50,116 54,120"/>
    <polygon points="62,120 66,116 70,120"/>
    <polygon points="78,120 82,116 86,120"/>
    <polygon points="94,120 98,116 102,120"/>
  </g>

  <!-- Jeweled cross boss at inner corner -->
  <g transform="translate(122 122)">
    <!-- Disc -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#000000" stroke-width="0.6" opacity="0.4"/>
    <!-- Cross (Latin/processional) -->
    <g fill="#000000" opacity="0.6">
      <rect x="-1.5" y="-10" width="3" height="20"/>
      <rect x="-7" y="-2" width="14" height="3"/>
    </g>
    <!-- Center jewel cabochon -->
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    <circle cx="-1" cy="-1" r="0.8" fill="#000000" opacity="0.5"/>
    <!-- Cross-tip pearls -->
    <circle cx="0" cy="-10" r="1.5" fill="#FFFFFF"/>
    <circle cx="0" cy="10" r="1.5" fill="#FFFFFF"/>
    <circle cx="-7" cy="-1" r="1.5" fill="#FFFFFF"/>
    <circle cx="7" cy="-1" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
