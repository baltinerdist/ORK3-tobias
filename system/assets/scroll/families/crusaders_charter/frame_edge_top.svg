<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 30" width="150" height="30">
  <desc>
    Crusader's Charter — top edge tile. Romanesque architrave: solid
    band with chevron moulding row on inner edge, three small Latin
    crosses spaced across, axial repeat.
    Informed by: Vézelay nave triforium chevron mouldings; license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <!-- Solid architrave band -->
  <rect x="0" y="2" width="150" height="14" fill="#FFFFFF"/>
  <rect x="0" y="0" width="150" height="2" fill="#FFFFFF" opacity="0.55"/>

  <!-- Three small Latin crosses spaced across the band -->
  <g fill="#000000" opacity="0.6">
    <rect x="24"  y="5" width="2" height="9"/>
    <rect x="21"  y="8" width="8" height="2"/>
    <rect x="74"  y="5" width="2" height="9"/>
    <rect x="71"  y="8" width="8" height="2"/>
    <rect x="124" y="5" width="2" height="9"/>
    <rect x="121" y="8" width="8" height="2"/>
  </g>

  <!-- Center jewel between crosses -->
  <g fill="#FFFFFF">
    <circle cx="50"  cy="9" r="2.5"/>
    <circle cx="100" cy="9" r="2.5"/>
  </g>
  <g fill="#000000" opacity="0.5">
    <circle cx="49" cy="8" r="0.8"/>
    <circle cx="99" cy="8" r="0.8"/>
  </g>

  <!-- Chevron moulding row on inner edge -->
  <g fill="#FFFFFF">
    <polygon points="0,18 4,24 0,24"/>
    <polygon points="4,18 8,24 12,18"/>
    <polygon points="12,18 16,24 20,18"/>
    <polygon points="20,18 24,24 28,18"/>
    <polygon points="28,18 32,24 36,18"/>
    <polygon points="36,18 40,24 44,18"/>
    <polygon points="44,18 48,24 52,18"/>
    <polygon points="52,18 56,24 60,18"/>
    <polygon points="60,18 64,24 68,18"/>
    <polygon points="68,18 72,24 76,18"/>
    <polygon points="76,18 80,24 84,18"/>
    <polygon points="84,18 88,24 92,18"/>
    <polygon points="92,18 96,24 100,18"/>
    <polygon points="100,18 104,24 108,18"/>
    <polygon points="108,18 112,24 116,18"/>
    <polygon points="116,18 120,24 124,18"/>
    <polygon points="124,18 128,24 132,18"/>
    <polygon points="132,18 136,24 140,18"/>
    <polygon points="140,18 144,24 148,18"/>
    <polygon points="148,18 150,21 150,18"/>
  </g>
</svg>
