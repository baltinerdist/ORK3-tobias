<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <desc>
    Crusader's Charter — seal stamp. Templar-style fleur-de-lis with
    cross-band: a fleur-de-lis (purity/Trinity) overlaid by a horizontal
    Latin cross-band (martial). Flanked by twin lions passant guardant
    serving as supporters. Encircled by inscription ring with pearl row.
    Informed by: Knights Hospitaller and Knights Templar seals (12th-13th
    c.); the Plantagenet "three lions" royal arms; the manuscript Charter
    of Jerusalem (Cambridge, Trinity College B.10.4); license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <g transform="translate(120 120)">
    <!-- Outer rings -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.55"/>

    <!-- Pearl row inner ring -->
    <g fill="#FFFFFF">
      <g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g>
      <g transform="rotate(15)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(30)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(45)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(60)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(75)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(90)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(105)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(120)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(135)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(150)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(165)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(180)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(195)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(210)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(225)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(240)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(255)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(270)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(285)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(300)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(315)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(330)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
      <g transform="rotate(345)"><g transform="translate(0 -94)"><circle cx="0" cy="0" r="2"/></g></g>
    </g>

    <!-- Inner ring -->
    <circle cx="0" cy="0" r="78" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>

    <!-- Central fleur-de-lis (large) -->
    <g fill="#FFFFFF">
      <!-- Center spike -->
      <path d="M 0 -56 L 8 -16 L -8 -16 Z"/>
      <!-- Bulb -->
      <ellipse cx="0" cy="-16" rx="20" ry="6"/>
      <!-- Left curl -->
      <path d="M -20 -16 Q -32 4 -22 12 Q -10 8 -8 -16 Z"/>
      <!-- Right curl -->
      <path d="M 20 -16 Q 32 4 22 12 Q 10 8 8 -16 Z"/>
      <!-- Cross-band overlay (Templar/Hospitaller martial mark) -->
      <rect x="-26" y="-10" width="52" height="6"/>
      <!-- Center cross (where fleur and band intersect) -->
      <rect x="-2" y="-26" width="4" height="22"/>
    </g>

    <!-- Twin lion supporters (passant guardant, flanking) -->
    <g fill="#FFFFFF">
      <!-- Left lion -->
      <g transform="translate(-50 36)">
        <ellipse cx="0" cy="0" rx="18" ry="9"/>
        <!-- Head -->
        <ellipse cx="-14" cy="-4" rx="8" ry="7"/>
        <!-- Mane -->
        <circle cx="-18" cy="-6" r="3"/>
        <circle cx="-22" cy="-2" r="3"/>
        <circle cx="-18" cy="2" r="2.5"/>
        <!-- Eye negative -->
        <circle cx="-16" cy="-5" r="0.9" fill="#000000"/>
        <!-- Legs -->
        <rect x="-10" y="6" width="3" height="6"/>
        <rect x="-2" y="6" width="3" height="6"/>
        <rect x="6" y="6" width="3" height="6"/>
        <rect x="14" y="6" width="3" height="6"/>
        <!-- Tail -->
        <path d="M 18 -4 Q 26 -10 22 -14" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      </g>
      <!-- Right lion (mirrored) -->
      <g transform="translate(50 36) scale(-1 1)">
        <ellipse cx="0" cy="0" rx="18" ry="9"/>
        <ellipse cx="-14" cy="-4" rx="8" ry="7"/>
        <circle cx="-18" cy="-6" r="3"/>
        <circle cx="-22" cy="-2" r="3"/>
        <circle cx="-18" cy="2" r="2.5"/>
        <circle cx="-16" cy="-5" r="0.9" fill="#000000"/>
        <rect x="-10" y="6" width="3" height="6"/>
        <rect x="-2" y="6" width="3" height="6"/>
        <rect x="6" y="6" width="3" height="6"/>
        <rect x="14" y="6" width="3" height="6"/>
        <path d="M 18 -4 Q 26 -10 22 -14" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>
