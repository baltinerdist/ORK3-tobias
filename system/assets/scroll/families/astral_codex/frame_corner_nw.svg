<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <desc>
    Astral Codex — NW corner. Astrological/alchemical motifs: scattered
    five-point silver stars, a small constellation diagram of Ursa Minor
    along the right edge, an alchemical sun glyph at the inner corner,
    Saturn-ring sigil on the bottom edge. Designed for clean 90/180/270
    rotation.
    Informed by: Aratus's Phaenomena (BL Harley MS 647); Liber Astronomiae
    of Bonatti; Splendor Solis alchemical plates (BL Harley MS 3469);
    license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <g fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.55">
    <line x1="150" y1="118" x2="150" y2="150"/>
    <line x1="118" y1="150" x2="150" y2="150"/>
  </g>

  <!-- Starfield: 5-point stars scattered along right + bottom -->
  <g fill="#FFFFFF">
    <!-- Right edge stars -->
    <polygon points="135,8 137,14 143,14 138,18 140,24 135,20 130,24 132,18 127,14 133,14"/>
    <polygon points="138,28 139,32 143,32 140,34 141,38 138,36 135,38 136,34 133,32 137,32"/>
    <polygon points="132,46 134,52 140,52 135,56 137,62 132,58 127,62 129,56 124,52 130,52"/>
    <polygon points="138,72 139,76 143,76 140,78 141,82 138,80 135,82 136,78 133,76 137,76"/>
    <polygon points="135,92 137,98 143,98 138,102 140,108 135,104 130,108 132,102 127,98 133,98"/>
    <!-- Bottom edge stars -->
    <polygon points="8,135 14,137 14,143 18,138 24,140 20,135 24,130 18,132 14,127 14,133"/>
    <polygon points="28,138 32,139 32,143 34,140 38,141 36,138 38,135 34,136 32,133 32,137"/>
    <polygon points="46,132 52,134 52,140 56,135 62,137 58,132 62,127 56,129 52,124 52,130"/>
    <polygon points="72,138 76,139 76,143 78,140 82,141 80,138 82,135 78,136 76,133 76,137"/>
    <polygon points="92,135 98,137 98,143 102,138 108,140 104,135 108,130 102,132 98,127 98,133"/>
  </g>

  <!-- Constellation lines (Ursa Minor, the Little Dipper) tracing along right edge -->
  <g fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.65">
    <line x1="135" y1="20" x2="138" y2="32"/>
    <line x1="138" y1="32" x2="135" y2="56"/>
    <line x1="135" y1="56" x2="138" y2="80"/>
    <line x1="138" y1="80" x2="135" y2="104"/>
  </g>

  <!-- Constellation lines along bottom (Cassiopeia W) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.65">
    <line x1="20" y1="135" x2="32" y2="138"/>
    <line x1="32" y1="138" x2="56" y2="135"/>
    <line x1="56" y1="135" x2="80" y2="138"/>
    <line x1="80" y1="138" x2="104" y2="135"/>
  </g>

  <!-- Inner-corner: alchemical Sun glyph (☉) with rays -->
  <g transform="translate(122 122)">
    <!-- Outer disc -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#000000" stroke-width="0.6" opacity="0.4"/>
    <!-- Sun: dot in circle (☉) -->
    <circle cx="0" cy="0" r="4" fill="#000000" opacity="0.6"/>
    <!-- 8 rays radiating outward -->
    <g stroke="#FFFFFF" stroke-width="2">
      <line x1="0" y1="-18" x2="0" y2="-22"/>
      <line x1="13" y1="-13" x2="16" y2="-16"/>
      <line x1="18" y1="0" x2="22" y2="0"/>
      <line x1="13" y1="13" x2="16" y2="16"/>
      <line x1="0" y1="18" x2="0" y2="22"/>
      <line x1="-13" y1="13" x2="-16" y2="16"/>
      <line x1="-18" y1="0" x2="-22" y2="0"/>
      <line x1="-13" y1="-13" x2="-16" y2="-16"/>
    </g>
  </g>

  <!-- Saturn-ring sigil floating in upper-left -->
  <g transform="translate(50 35)">
    <ellipse cx="0" cy="0" rx="6" ry="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    <circle cx="-1" cy="-1" r="0.9" fill="#000000" opacity="0.5"/>
  </g>

  <!-- Crescent moon glyph in lower-left -->
  <g transform="translate(35 60)">
    <path d="M 0 -6 A 6 6 0 1 0 0 6 A 4 4 0 1 1 0 -6 Z" fill="#FFFFFF"/>
  </g>
</svg>
