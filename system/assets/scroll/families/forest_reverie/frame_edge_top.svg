<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 30" width="150" height="30">
  <desc>
    Forest Reverie — top edge tile. Gnarled oak vine with five-lobed
    leaves spaced across, three acorns in clusters, irregular sinuous
    trunk. Edges matched for horizontal repeat.
    Informed by: Sherwood Forest Hours marginalia; license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <line x1="0" y1="29" x2="150" y2="29" stroke="#FFFFFF" stroke-width="1" opacity="0.55"/>

  <!-- Gnarled trunk — irregular curve -->
  <path d="M 0 16 Q 8 8 18 16 Q 28 24 38 14 Q 48 8 60 18 Q 70 22 80 12 Q 90 8 100 18 Q 110 24 122 14 Q 132 10 142 18 Q 146 19 150 16"
        fill="none" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Knot bumps -->
  <g fill="#FFFFFF">
    <circle cx="18" cy="14" r="1.5"/>
    <circle cx="60" cy="20" r="1.5"/>
    <circle cx="100" cy="20" r="1.5"/>
    <circle cx="142" cy="20" r="1.5"/>
  </g>

  <!-- Five-lobed oak leaves (alternating sides) -->
  <g fill="#FFFFFF">
    <g transform="translate(15 7)">
      <path d="M 0 0 Q -2 -6 4 -5 Q 7 -2 5 1 Q 8 2 6 4 Q 3 5 2 3 Q -2 5 -3 3 Q -5 0 -2 -1 Z"/>
    </g>
    <g transform="translate(45 24)">
      <path d="M 0 0 Q -2 -6 4 -5 Q 7 -2 5 1 Q 8 2 6 4 Q 3 5 2 3 Q -2 5 -3 3 Q -5 0 -2 -1 Z" opacity="0.85"/>
    </g>
    <g transform="translate(75 7)">
      <path d="M 0 0 Q -2 -6 4 -5 Q 7 -2 5 1 Q 8 2 6 4 Q 3 5 2 3 Q -2 5 -3 3 Q -5 0 -2 -1 Z"/>
    </g>
    <g transform="translate(105 24)">
      <path d="M 0 0 Q -2 -6 4 -5 Q 7 -2 5 1 Q 8 2 6 4 Q 3 5 2 3 Q -2 5 -3 3 Q -5 0 -2 -1 Z" opacity="0.85"/>
    </g>
    <g transform="translate(135 7)">
      <path d="M 0 0 Q -2 -6 4 -5 Q 7 -2 5 1 Q 8 2 6 4 Q 3 5 2 3 Q -2 5 -3 3 Q -5 0 -2 -1 Z"/>
    </g>
  </g>

  <!-- Acorn clusters (3 across) -->
  <g fill="#FFFFFF">
    <g transform="translate(30 10)">
      <ellipse cx="0" cy="-3" rx="2.5" ry="1.5"/>
      <ellipse cx="0" cy="0" rx="2" ry="2.8" opacity="0.85"/>
    </g>
    <g transform="translate(90 10)">
      <ellipse cx="0" cy="-3" rx="2.5" ry="1.5"/>
      <ellipse cx="0" cy="0" rx="2" ry="2.8" opacity="0.85"/>
    </g>
    <g transform="translate(120 10)">
      <ellipse cx="0" cy="-3" rx="2.5" ry="1.5"/>
      <ellipse cx="0" cy="0" rx="2" ry="2.8" opacity="0.85"/>
    </g>
  </g>
</svg>
