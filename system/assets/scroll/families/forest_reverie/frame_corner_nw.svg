<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <desc>
    Forest Reverie — NW corner. Gnarled oak vine with five-lobed oak
    leaves and acorns; tendrils break past the page-margin line into
    the parchment field; concentric carved-bark spiral at the inner corner.
    Designed for clean 90/180/270 rotation.
    Informed by: Sherwood Forest Hours (BL Add MS 18852, c. 1500);
    Renaissance ornamental engravings of Israhel van Meckenem; license: PD.
    SVG path data: original procedural geometry, CC0.
  </desc>

  <g fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.55">
    <line x1="150" y1="118" x2="150" y2="150"/>
    <line x1="118" y1="150" x2="150" y2="150"/>
  </g>

  <!-- Gnarled vine trunk along right edge — irregular, knotty -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.5">
    <path d="M 132 0 Q 138 12 130 22 Q 124 34 134 44 Q 142 54 130 64 Q 122 74 134 86 Q 142 96 130 106 Q 124 114 132 116"/>
  </g>
  <!-- Knot bumps along the trunk -->
  <g fill="#FFFFFF">
    <ellipse cx="138" cy="20" rx="3" ry="2"/>
    <ellipse cx="124" cy="38" rx="3" ry="2"/>
    <ellipse cx="138" cy="58" rx="3" ry="2"/>
    <ellipse cx="124" cy="80" rx="3" ry="2"/>
    <ellipse cx="138" cy="100" rx="3" ry="2"/>
  </g>

  <!-- Gnarled vine along bottom edge -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.5">
    <path d="M 0 132 Q 12 138 22 130 Q 34 124 44 134 Q 54 142 64 130 Q 74 122 86 134 Q 96 142 106 130 Q 114 124 116 132"/>
  </g>
  <g fill="#FFFFFF">
    <ellipse cx="20" cy="138" rx="2" ry="3"/>
    <ellipse cx="38" cy="124" rx="2" ry="3"/>
    <ellipse cx="58" cy="138" rx="2" ry="3"/>
    <ellipse cx="80" cy="124" rx="2" ry="3"/>
    <ellipse cx="100" cy="138" rx="2" ry="3"/>
  </g>

  <!-- Five-lobed oak leaves (right side, breaking out into margin) -->
  <g fill="#FFFFFF">
    <g transform="translate(146 14) rotate(20)">
      <path d="M 0 0 Q -2 -10 4 -8 Q 8 -4 6 0 Q 10 2 8 6 Q 4 8 2 4 Q -2 8 -4 4 Q -6 0 -2 -2 Z"/>
    </g>
    <g transform="translate(112 38) rotate(-20)">
      <path d="M 0 0 Q -2 -10 4 -8 Q 8 -4 6 0 Q 10 2 8 6 Q 4 8 2 4 Q -2 8 -4 4 Q -6 0 -2 -2 Z"/>
    </g>
    <g transform="translate(146 76) rotate(15)">
      <path d="M 0 0 Q -2 -10 4 -8 Q 8 -4 6 0 Q 10 2 8 6 Q 4 8 2 4 Q -2 8 -4 4 Q -6 0 -2 -2 Z"/>
    </g>
    <g transform="translate(112 96) rotate(-15)">
      <path d="M 0 0 Q -2 -10 4 -8 Q 8 -4 6 0 Q 10 2 8 6 Q 4 8 2 4 Q -2 8 -4 4 Q -6 0 -2 -2 Z"/>
    </g>
  </g>

  <!-- Bottom-side oak leaves -->
  <g fill="#FFFFFF">
    <g transform="translate(14 146) rotate(110)">
      <path d="M 0 0 Q -2 -10 4 -8 Q 8 -4 6 0 Q 10 2 8 6 Q 4 8 2 4 Q -2 8 -4 4 Q -6 0 -2 -2 Z"/>
    </g>
    <g transform="translate(38 112) rotate(70)">
      <path d="M 0 0 Q -2 -10 4 -8 Q 8 -4 6 0 Q 10 2 8 6 Q 4 8 2 4 Q -2 8 -4 4 Q -6 0 -2 -2 Z"/>
    </g>
    <g transform="translate(76 146) rotate(105)">
      <path d="M 0 0 Q -2 -10 4 -8 Q 8 -4 6 0 Q 10 2 8 6 Q 4 8 2 4 Q -2 8 -4 4 Q -6 0 -2 -2 Z"/>
    </g>
  </g>

  <!-- Acorns: small oval cap + body -->
  <g fill="#FFFFFF">
    <g transform="translate(108 12)">
      <ellipse cx="0" cy="-4" rx="3.5" ry="2.5"/>
      <ellipse cx="0" cy="0" rx="3" ry="4" opacity="0.85"/>
    </g>
    <g transform="translate(110 70)">
      <ellipse cx="0" cy="-4" rx="3.5" ry="2.5"/>
      <ellipse cx="0" cy="0" rx="3" ry="4" opacity="0.85"/>
    </g>
    <g transform="translate(70 110)">
      <ellipse cx="-4" cy="0" rx="2.5" ry="3.5"/>
      <ellipse cx="0" cy="0" rx="4" ry="3" opacity="0.85"/>
    </g>
  </g>

  <!-- Inner-corner: concentric carved bark spiral -->
  <g transform="translate(122 122)" fill="none" stroke="#FFFFFF" stroke-width="2.5">
    <path d="M 0 -14 Q 14 -10 14 4 Q 12 14 -2 14 Q -12 12 -12 4 Q -10 -2 -2 -2 Q 4 0 4 6"/>
  </g>
  <circle cx="120" cy="124" r="2" fill="#FFFFFF"/>
</svg>
